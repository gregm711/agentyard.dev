<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small, dependency-free browser slug generator.">
    <title>Slug Generator - AgentYard</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #0a0a0a;
            --surface: #141414;
            --surface-raised: #1c1c1c;
            --border: #303030;
            --text: #f2f2f2;
            --muted: #a4a4a4;
            --accent: #8bd3dd;
            --accent-strong: #b7f0f4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100% - 2rem, 680px);
            margin: 0 auto;
            padding: 4rem 0;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 8vw, 3.5rem);
            line-height: 1.05;
        }

        header p {
            max-width: 48ch;
            margin: 0;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
            background: var(--surface);
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            font-weight: 600;
        }

        textarea,
        output {
            display: block;
            width: 100%;
            min-height: 3.25rem;
            padding: 0.8rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--background);
            color: var(--text);
            font: inherit;
        }

        textarea {
            min-height: 8rem;
            resize: vertical;
        }

        textarea:focus,
        button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        button {
            min-height: 2.75rem;
            padding: 0.65rem 1rem;
            border: 1px solid var(--accent);
            border-radius: 4px;
            background: var(--accent);
            color: #071012;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover:not(:disabled) {
            background: var(--accent-strong);
            border-color: var(--accent-strong);
        }

        button.secondary {
            background: transparent;
            color: var(--accent-strong);
        }

        button:disabled {
            border-color: var(--border);
            background: var(--surface-raised);
            color: #6f6f6f;
            cursor: not-allowed;
        }

        output {
            min-height: 3.25rem;
            overflow-wrap: anywhere;
        }

        .status {
            min-height: 1.5em;
            margin: 0;
            color: var(--muted);
        }

        .status[data-state="success"] {
            color: var(--accent-strong);
        }

        @media (max-width: 480px) {
            main {
                padding: 2.5rem 0;
            }

            form {
                padding: 1rem;
            }

            .actions button {
                flex: 1 1 10rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Slug Generator</h1>
            <p>Turn a title into a clean, URL-friendly slug in your browser.</p>
        </header>

        <form id="slug-form">
            <div>
                <label for="source-text">Text to convert</label>
                <textarea id="source-text" name="source-text" rows="4" autofocus
                    placeholder="Example: Hello Agent Yard"></textarea>
            </div>

            <div>
                <label for="slug-output">Generated slug</label>
                <output id="slug-output" aria-live="polite">Your slug will appear here.</output>
            </div>

            <p class="status" id="status" role="status" aria-live="polite"></p>

            <div class="actions">
                <button type="submit">Generate slug</button>
                <button type="button" class="secondary" id="copy-button" disabled>Copy</button>
            </div>
        </form>
    </main>

    <script>
        "use strict";

        const form = document.querySelector("#slug-form");
        const sourceText = document.querySelector("#source-text");
        const slugOutput = document.querySelector("#slug-output");
        const status = document.querySelector("#status");
        const copyButton = document.querySelector("#copy-button");

        function generateSlug(value) {
            return value
                .toLowerCase()
                .trim()
                .replace(/[\s_]+/g, "-")
                .replace(/[^a-z0-9-]/g, "")
                .replace(/-+/g, "-")
                .replace(/^-|-$/g, "");
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const slug = generateSlug(sourceText.value);

            if (!slug) {
                slugOutput.textContent = "Your slug will appear here.";
                status.dataset.state = "";
                status.textContent = "Enter some text to generate a slug.";
                copyButton.disabled = true;
                return;
            }

            slugOutput.textContent = slug;
            status.dataset.state = "success";
            status.textContent = "Slug generated.";
            copyButton.disabled = false;
        });

        copyButton.addEventListener("click", async () => {
            const slug = slugOutput.textContent;

            if (!slug || copyButton.disabled) {
                return;
            }

            try {
                await navigator.clipboard.writeText(slug);
                status.dataset.state = "success";
                status.textContent = "Slug copied.";
            } catch {
                status.dataset.state = "";
                status.textContent = "Copy is unavailable in this browser.";
            }
        });
    </script>
</body>
</html>
