<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Counter</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f4f1ea;
            --panel: #ffffff;
            --text: #17212b;
            --muted: #5c6773;
            --border: #d6d0c4;
            --primary: #145c9e;
            --primary-hover: #0f4b82;
            --danger: #8f2f2f;
            --danger-hover: #752424;
            --focus: #f5b84b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background:
                linear-gradient(135deg, rgba(20, 92, 158, 0.12), transparent 38%),
                linear-gradient(315deg, rgba(143, 47, 47, 0.1), transparent 34%),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        main {
            width: min(100%, 30rem);
            padding: 2rem;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 18px 40px rgba(23, 33, 43, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 8vw, 3rem);
            line-height: 1.05;
        }

        .description {
            margin: 0 auto 1.75rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .counter {
            margin: 0 0 1.5rem;
        }

        .counter-label {
            display: block;
            margin-bottom: 0.35rem;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .counter-value {
            display: block;
            min-height: 5rem;
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        button {
            min-height: 3rem;
            border: 0;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        #add-signal {
            background: var(--primary);
        }

        #add-signal:hover {
            background: var(--primary-hover);
        }

        #reset {
            background: var(--danger);
        }

        #reset:hover {
            background: var(--danger-hover);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 34rem) {
            body {
                padding: 1rem;
            }

            main {
                padding: 1.5rem;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Signal Counter</h1>
        <p class="description">Use this counter to track collaboration signals during an agent session.</p>

        <p class="counter" aria-live="off">
            <span class="counter-label">Current count</span>
            <span class="counter-value" id="count">0</span>
        </p>

        <div class="actions">
            <button type="button" id="add-signal">Add signal</button>
            <button type="button" id="reset">Reset</button>
        </div>

        <p class="sr-only" id="status" role="status" aria-live="polite">Current count is 0.</p>
    </main>

    <script>
        (() => {
            const storageKey = "agentyard.signalCounter.count";
            const countEl = document.querySelector("#count");
            const statusEl = document.querySelector("#status");
            const addButton = document.querySelector("#add-signal");
            const resetButton = document.querySelector("#reset");

            const readCount = () => {
                const storedValue = Number.parseInt(localStorage.getItem(storageKey), 10);
                return Number.isFinite(storedValue) && storedValue >= 0 ? storedValue : 0;
            };

            let count = readCount();

            const render = () => {
                countEl.textContent = String(count);
                statusEl.textContent = `Current count is ${count}.`;
                localStorage.setItem(storageKey, String(count));
            };

            addButton.addEventListener("click", () => {
                count += 1;
                render();
            });

            resetButton.addEventListener("click", () => {
                if (window.confirm("Reset signal count to 0?")) {
                    count = 0;
                    render();
                }
            });

            render();
        })();
    </script>
</body>
</html>
